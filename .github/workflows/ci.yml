# Checks every push and pull request (audit report T2): each extension against the core on GitHub main
# (ext check, vitest, svelte-check), the Python services' tests, and that catalog.json is made from the folders.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A core change can break an extension without a commit here: check once a day too.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  extensions:
    name: Extensions on core main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: b-niamin/assistant
          path: .core
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: .core/apps/web/package-lock.json
      - name: catalog.json is made from the extensions
        run: node scripts/build-catalog.mjs --check
      - run: npm ci --no-audit --no-fund
        working-directory: .core/apps/web
      - name: ext check (manifests, imports, routes, translations)
        run: EXTENSIONS_DIR=$GITHUB_WORKSPACE/extensions node .core/scripts/ext.mjs check $(ls extensions) --languages pl
      - name: Tests
        run: EXTENSIONS_DIR=$GITHUB_WORKSPACE/extensions npm test
        working-directory: .core/apps/web
      - name: Types
        run: EXTENSIONS_DIR=$GITHUB_WORKSPACE/extensions npm run check
        working-directory: .core/apps/web

  services:
    name: Python services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: health/services/garmin-sync
            modules: sync.__main__ sync.store
          - service: monitor/services/collector
            modules: collector.__main__ collector.store
    defaults:
      run:
        working-directory: extensions/${{ matrix.service }}
    env:
      # `import beni`: the worker puts docker/worker/lib on every unit's path.
      PYTHONPATH: ${{ github.workspace }}/.core/docker/worker/lib
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: b-niamin/assistant
          path: .core
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Imports (as the worker starts them)
        run: python -c "import importlib, sys; [importlib.import_module(m) for m in sys.argv[1:]]" ${{ matrix.modules }}
      - run: python -m pytest -q
