<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Gym Tracker: a private workout log that runs from one HTML file. Data stays in your browser.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<style>
/* Layout: one phone-width column (max 560px), floating tab bar, bottom sheets for detail.
   Look: the assistant's (specs/001-design.md). Inside the shell its tokens (--page, --g-surface, --g-ink,
   --accent, --hue-*, ...) and <assistant-beni> are injected; the fallbacks keep the file working alone.
   The four plate colours map to the shell's red, accent, yellow and green. System sans throughout. */
:root{
  --bg:var(--page,#f9f9f7);--g-surface:var(--surface,#fcfcfb);--sunk:var(--surface-2,#f0efec);--g-ink:var(--ink,#0b0b0b);--ink2:var(--ink-2,#52514e);--muted:var(--ink-2,#52514e);--faint:var(--ink-3,#898781);--line:var(--grid,#e1e0d9);
  --red:var(--hue-red,#e34948);--blue:var(--accent,#2a78d6);--yellow:var(--hue-yellow,#eda100);--green:var(--hue-green,#008300);
  --red-soft:color-mix(in srgb,var(--red) 14%,var(--surface,#fcfcfb));--blue-soft:var(--accent-wash,rgba(42,120,214,.1));--green-soft:color-mix(in srgb,var(--green) 12%,var(--surface,#fcfcfb));--green-line:color-mix(in srgb,var(--green) 35%,var(--surface,#fcfcfb));--yellow-soft:color-mix(in srgb,var(--yellow) 16%,var(--surface,#fcfcfb));--yellow-ink:var(--ink,#0b0b0b);
  --body:color-mix(in srgb,var(--ink-3,#898781) 38%,var(--surface,#fcfcfb));--body2:color-mix(in srgb,var(--ink-3,#898781) 20%,var(--surface,#fcfcfb));
  --pri:var(--accent,#2a78d6);--pri2:var(--accent,#2a78d6);--on-pri:#fff;
  --hero1:var(--surface,#fcfcfb);--hero2:var(--surface,#fcfcfb);--hero-fg:var(--ink,#0b0b0b);--hero-mut:var(--ink-2,#52514e);--hero-dim:var(--ink-3,#898781);--hero-tile:var(--surface-2,#f0efec);
  --nav:color-mix(in srgb,var(--surface,#fcfcfb) 92%,transparent);--nav-fg:var(--ink-3,#898781);--glass:color-mix(in srgb,var(--surface,#fcfcfb) 88%,transparent);
  --g-ring:var(--ring,rgba(11,11,11,.1));--on:var(--accent-ink,#1c5cab);
  --scrim:rgba(20,24,34,.45);--sh-c:27,33,48;
  --shadow:0 0 0 1px var(--g-ring);
  --cond:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);
  --text:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:var(--page,#0d0d0d);--g-surface:var(--surface,#1a1a19);--sunk:var(--surface-2,#262624);--g-ink:var(--ink,#f0efec);--ink2:var(--ink-2,#c3c2b7);--muted:var(--ink-2,#c3c2b7);--faint:var(--ink-3,#898781);--line:var(--grid,#2c2c2a);
  --red:var(--hue-red,#e66767);--blue:var(--accent,#3987e5);--yellow:var(--hue-yellow,#c98500);--green:var(--hue-green,#008300);
  --red-soft:color-mix(in srgb,var(--red) 14%,var(--surface,#1a1a19));--blue-soft:var(--accent-wash,rgba(57,135,229,.14));--green-soft:color-mix(in srgb,var(--green) 12%,var(--surface,#1a1a19));--green-line:color-mix(in srgb,var(--green) 35%,var(--surface,#1a1a19));--yellow-soft:color-mix(in srgb,var(--yellow) 16%,var(--surface,#1a1a19));--yellow-ink:var(--ink,#f0efec);
  --body:color-mix(in srgb,var(--ink-3,#898781) 38%,var(--surface,#1a1a19));--body2:color-mix(in srgb,var(--ink-3,#898781) 20%,var(--surface,#1a1a19));
  --pri:var(--accent,#3987e5);--pri2:var(--accent,#3987e5);--on-pri:#fff;
  --hero1:var(--surface,#1a1a19);--hero2:var(--surface,#1a1a19);--hero-fg:var(--ink,#f0efec);--hero-mut:var(--ink-2,#c3c2b7);--hero-dim:var(--ink-3,#898781);--hero-tile:var(--surface-2,#262624);
  --nav:color-mix(in srgb,var(--surface,#1a1a19) 92%,transparent);--nav-fg:var(--ink-3,#898781);--glass:color-mix(in srgb,var(--surface,#1a1a19) 88%,transparent);
  --g-ring:var(--ring,rgba(255,255,255,.1));--on:var(--accent-ink,#86b6ef);
  --scrim:rgba(0,0,0,.6);--sh-c:0,0,0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:var(--page,#0d0d0d);--g-surface:var(--surface,#1a1a19);--sunk:var(--surface-2,#262624);--g-ink:var(--ink,#f0efec);--ink2:var(--ink-2,#c3c2b7);--muted:var(--ink-2,#c3c2b7);--faint:var(--ink-3,#898781);--line:var(--grid,#2c2c2a);
  --red:var(--hue-red,#e66767);--blue:var(--accent,#3987e5);--yellow:var(--hue-yellow,#c98500);--green:var(--hue-green,#008300);
  --red-soft:color-mix(in srgb,var(--red) 14%,var(--surface,#1a1a19));--blue-soft:var(--accent-wash,rgba(57,135,229,.14));--green-soft:color-mix(in srgb,var(--green) 12%,var(--surface,#1a1a19));--green-line:color-mix(in srgb,var(--green) 35%,var(--surface,#1a1a19));--yellow-soft:color-mix(in srgb,var(--yellow) 16%,var(--surface,#1a1a19));--yellow-ink:var(--ink,#f0efec);
  --body:color-mix(in srgb,var(--ink-3,#898781) 38%,var(--surface,#1a1a19));--body2:color-mix(in srgb,var(--ink-3,#898781) 20%,var(--surface,#1a1a19));
  --pri:var(--accent,#3987e5);--pri2:var(--accent,#3987e5);--on-pri:#fff;
  --hero1:var(--surface,#1a1a19);--hero2:var(--surface,#1a1a19);--hero-fg:var(--ink,#f0efec);--hero-mut:var(--ink-2,#c3c2b7);--hero-dim:var(--ink-3,#898781);--hero-tile:var(--surface-2,#262624);
  --nav:color-mix(in srgb,var(--surface,#1a1a19) 92%,transparent);--nav-fg:var(--ink-3,#898781);--glass:color-mix(in srgb,var(--surface,#1a1a19) 88%,transparent);
  --g-ring:var(--ring,rgba(255,255,255,.1));--on:var(--accent-ink,#86b6ef);
  --scrim:rgba(0,0,0,.6);--sh-c:0,0,0;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--g-ink);font-family:var(--text);font-size:16px;line-height:1.4}
body{margin:0;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));min-height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:560px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hide{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.danger{color:var(--red)}
.link{color:var(--blue);font-weight:600;font-size:15px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 10px;min-height:40px}
.top h1{font-family:var(--cond);font-weight:700;font-size:24px;line-height:1.1;margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--g-surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--g-ink)}
.gear svg{width:22px;height:22px}

/* generic blocks */
.panel{background:var(--g-surface);border-radius:var(--radius,8px);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.h2{font-family:var(--cond);font-weight:700;font-size:22px;margin:0 0 8px;line-height:1.1}
.h2row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.h2row .h2{margin:0}
.notice{font-size:14px;color:var(--ink2);border-radius:var(--radius,8px);padding:10px 12px;margin-bottom:14px;background:var(--yellow-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice span{flex:1;min-width:12ch}
.notice button{color:var(--blue);font-weight:700;font-size:14px}
.empty{color:var(--muted);padding:20px 4px;font-size:15px;max-width:44ch;display:flex;align-items:center;gap:12px}
.empty assistant-beni{flex:0 0 auto}
.top .brand{display:flex;align-items:center;gap:10px;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:var(--radius-sm,6px);font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.01em;transition:transform .15s var(--ease),box-shadow .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn-ink{background:linear-gradient(180deg,var(--pri2),var(--pri));color:var(--on-pri);box-shadow:0 6px 16px rgba(var(--sh-c),.22)}
.btn-line{background:var(--g-surface);color:var(--g-ink);box-shadow:var(--shadow)}
.btn-line.danger,.btn.danger{background:var(--red-soft);color:var(--red);box-shadow:none}
.btn-block{width:100%}
.btn-sm{height:40px;padding:0 16px;font-size:16px}
.sheet .btn-line{background:var(--sunk);box-shadow:none}
.sheet .btn.danger{background:var(--red-soft);color:var(--red)}

.stepper{display:inline-flex;align-items:center;border-radius:var(--radius-sm,6px);background:var(--sunk);overflow:hidden}
.stepper button{width:38px;height:34px;font-size:18px}
.stepper span{min-width:26px;text-align:center;font-family:var(--cond);font-weight:700;font-size:17px}

.seg{display:flex;background:var(--sunk);border-radius:var(--radius-sm,6px);padding:4px;gap:3px;margin-bottom:10px}
.seg button{flex:1;min-width:0;height:34px;border-radius:var(--radius-sm,6px);font-family:var(--cond);font-size:16px;font-weight:600;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.seg button.on{background:var(--g-surface);color:var(--g-ink);box-shadow:0 1px 2px rgba(var(--sh-c),.14)}

/* tab bar */
nav.tabs{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:var(--radius,8px);background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 0 0 1px var(--g-ring),0 8px 24px rgba(var(--sh-c),.12);max-width:540px;margin:0 auto;display:flex;z-index:20}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-family:var(--cond);font-size:14px;font-weight:600;color:var(--nav-fg);border-radius:var(--radius,8px);position:relative;transition:background .25s var(--ease),color .2s}
nav.tabs button.on{color:var(--on);background:var(--blue-soft)}
nav.tabs svg{width:22px;height:22px}
nav.tabs .live{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--nav);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}

/* home hero */
.hero{background:var(--hero1);color:var(--hero-fg);border-radius:var(--radius,8px);padding:14px 14px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero-lab{font-size:14px;color:var(--hero-mut)}
.hero-num{font-family:var(--cond);font-weight:700;font-size:52px;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-num small{font-size:30px;color:var(--hero-dim);font-weight:700}
.hero-sub{font-size:14px;color:var(--hero-mut);margin-top:2px}
.ring{width:76px;height:76px;transform:rotate(-90deg);flex:0 0 auto}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .rb{stroke:rgba(255,255,255,.12)}
.ring .rf{stroke:var(--green);stroke-dasharray:var(--c);stroke-dashoffset:var(--o);animation:ringin 1s var(--ease) both}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}
.hweek{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0 0}
.hd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0;border-radius:var(--radius,8px);background:var(--hero-tile)}
.hd span{font-size:11px;color:var(--hero-mut)}
.hd b{font-family:var(--cond);font-size:19px;font-weight:700}
.hd.has{background:var(--blue-soft);color:var(--on)}
.hd.has span{color:var(--on)}
.hd.today{box-shadow:inset 0 0 0 1.5px var(--blue)}
.hd.future b{color:var(--hero-dim)}
.hero-goal{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:13px;color:var(--hero-mut)}
.hero .stepper{background:var(--sunk);color:var(--g-ink)}

.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 14px}
.qa-b{display:flex;flex-direction:column;align-items:center;gap:7px;transition:transform .15s var(--ease)}
.qa-b:active{transform:scale(.93)}
.qa-b:disabled{opacity:.4;cursor:default}
.qa-i{width:58px;height:58px;border-radius:50%;background:var(--g-surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--g-ink)}
.qa-i svg{width:24px;height:24px}
.qa-b.pri .qa-i{background:var(--blue);color:#fff;box-shadow:none}
.qa-l{font-size:13px;font-weight:600;text-align:center}

.wa{display:flex;align-items:center;gap:12px}
.wa .tx{flex:1;min-width:0}

.plan{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:12px 0}
.h2row + .plan{border-top:0}
.plan .pi{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.stack{display:flex;flex:0 0 auto}
.ptx{display:flex;flex-direction:column;min-width:0}
.plan .pn{font-family:var(--cond);font-weight:700;font-size:20px;line-height:1.1}
.plan .pm{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan .go{flex:0 0 auto;height:36px;padding:0 16px;border-radius:var(--radius-sm,6px);background:var(--pri);color:var(--on-pri);font-family:var(--cond);font-weight:700;font-size:16px}
.plan-del{font-size:18px;color:var(--muted);padding:6px 8px;min-width:36px}
.plan-del.confirm{font-size:13px;font-weight:700;color:var(--red)}

/* exercise thumbnail: mini muscle map */
.thumb{flex:0 0 auto;width:52px;height:52px;border-radius:var(--radius,8px);background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.thumb svg{height:88%;width:auto;display:block}
.thumb.ph{font-family:var(--cond);font-weight:700;font-size:22px;color:var(--muted)}
.thumb.sm{width:44px;height:44px;border-radius:var(--radius-sm,6px)}
.thumb.av{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px var(--g-surface);margin-left:-12px;font-size:16px}
.stack .thumb.av:first-child{margin-left:0}

/* live workout bar */
.bar-live{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;margin:-10px 0 10px;padding:10px 4px;display:flex;align-items:center;gap:12px;isolation:isolate}
.bar-live::before{content:"";position:absolute;inset:6px -8px;border-radius:var(--radius-sm,6px);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);z-index:-1}
.bar-live .clock{font-family:var(--cond);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;min-width:74px;padding-left:8px}
.bar-live .prog{flex:1;min-width:0}
.bar-live .prog .t{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.bar-live .pb{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:3px}
.bar-live .pb i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .4s var(--ease)}
.bar-live .btn{height:38px}

.wk-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.wk-meta input[type=date]{background:var(--g-surface);border:0;border-radius:var(--radius-sm,6px);padding:8px 14px;font-size:15px;box-shadow:var(--shadow)}

/* exercise card */
.ex{background:var(--g-surface);border-radius:var(--radius,8px);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.ex.complete{box-shadow:var(--shadow),inset 0 0 0 2px var(--green-line)}
.ex.new{animation:rise .35s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.ex-h{display:grid;grid-template-columns:52px minmax(0,1fr) auto;column-gap:12px;row-gap:8px;align-items:center;padding:14px 14px 6px}
.ex-thb{display:block;line-height:0}
.ex-title{display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left}
.ex-name{font-family:var(--cond);font-weight:700;font-size:21px;line-height:1.08;overflow-wrap:anywhere;hyphens:auto}
.ex-tags{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;color:var(--red);font-weight:600}
.ex-act{display:flex;gap:6px;align-self:start}
.ic{width:36px;height:36px;border-radius:50%;background:var(--sunk);color:var(--muted);display:grid;place-items:center;transition:background .2s,color .2s,transform .12s var(--ease)}
.ic:active{transform:scale(.92)}
.ic svg{width:19px;height:19px}
.ic.del:hover{color:var(--red)}
.ic.del.confirm{width:auto;padding:0 12px;border-radius:var(--radius-sm,6px);background:var(--red-soft);color:var(--red);font-size:13px;font-weight:700}
.ex-prev{grid-column:1/-1;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:inline-block;background:var(--yellow);color:#1B2130;font-family:var(--cond);font-size:14px;font-weight:700;border-radius:4px;padding:0 6px;animation:pop .45s var(--ease)}
.pairtag{display:inline-block;background:var(--yellow-soft);color:var(--yellow-ink);border-radius:var(--radius-sm,6px);padding:1px 8px;font-size:11px;font-weight:700}

.qo{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 14px 8px}
.qo-b{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px;border-radius:var(--radius,8px);background:var(--sunk);transition:background .2s,color .2s,transform .12s var(--ease);min-width:0}
.qo-b:active{transform:scale(.95)}
.qo-b b{font-family:var(--cond);font-size:17px;font-weight:700;line-height:1.1}
.qo-b span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.qo-b.on{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(31,95,196,.3)}
.qo-b.on span{color:rgba(255,255,255,.8)}

.sets{padding:0 14px 4px}
.sets-head,.set{display:grid;grid-template-columns:24px 1fr 1fr 46px 30px;gap:8px;align-items:center}
.sets.time .sets-head,.sets.time .set{grid-template-columns:24px 1fr 46px 30px}
.sets-head{font-size:12px;color:var(--muted);padding:2px 0 4px}
.sets-head div{text-align:center}
.set{padding:4px 0}
.set.new{animation:rise .3s var(--ease) both}
.set .n{font-family:var(--cond);font-weight:700;font-size:20px;color:var(--muted);text-align:center;transition:color .2s}
.set input{width:100%;height:46px;background:var(--sunk);border:0;border-radius:var(--radius,8px);text-align:center;font-family:var(--cond);font-size:22px;font-weight:700;padding:0 4px;font-variant-numeric:tabular-nums;-moz-appearance:textfield;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .15s,background .15s}
.set input::-webkit-outer-spin-button,.set input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--blue);background:var(--g-surface)}
.set input::placeholder{color:var(--faint);font-weight:600}
.chk{width:46px;height:46px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--faint);transition:background .2s,color .2s,transform .12s}
.chk svg{width:22px;height:22px}
.chk svg path{stroke-dasharray:24;stroke-dashoffset:0}
.set.done .chk{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(47,154,87,.35)}
.set.done .n{color:var(--green)}
.set.done input{background:var(--green-soft)}
.set.pop .chk{animation:pop .4s var(--ease)}
.set.pop .chk svg path{animation:draw .35s .05s var(--ease) both}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:24}}
.set.isPR .n::after{content:"PR";display:block;font-size:10px;color:#1B2130;background:var(--yellow);border-radius:2px;line-height:1.3;margin-top:1px}
.x{width:30px;height:30px;border-radius:50%;color:var(--muted);display:grid;place-items:center;font-size:22px}
.kgw{position:relative;display:block}
.kgw .ph{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:10px;font-weight:600;color:var(--muted);pointer-events:none;line-height:1}
.kgw.p input{padding-bottom:9px}
.ex-foot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 14px 14px}
.ex-foot .tool{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.ex-foot .tool:first-of-type{margin-left:auto}
.note{display:block;margin:0 14px 10px;width:calc(100% - 28px);min-height:42px;border:0;border-radius:var(--radius,8px);background:var(--sunk);padding:8px 10px;font-size:14px;resize:vertical}
.note:focus{outline:none;box-shadow:inset 0 0 0 2px var(--blue);background:var(--g-surface)}
.prevnote{margin:-4px 14px 8px;font-size:13px;color:var(--muted)}

.fold summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:28px}
.fold summary::-webkit-details-marker{display:none}
.fold summary .chev{transition:transform .2s}
.fold[open] summary .chev{transform:rotate(180deg)}
.fold[open] summary{margin-bottom:10px}

/* muscle maps */
.map-wrap{display:flex;flex-direction:column;align-items:stretch;gap:10px}
.map-wrap svg{width:100%;max-width:240px;height:auto;margin:0 auto;display:block}
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.mlist>.foot{grid-column:1/-1;font-size:11px;color:var(--muted);margin-top:6px}
.mlist.small{display:block;font-size:14px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:14px;padding:3px 0}
.mrow .bar{grid-column:1/-1;height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}
.mrow .bar i{display:block;height:100%;background:var(--red);border-radius:3px;transform-origin:left;animation:grow .7s var(--ease) both}
.mrow b{font-family:var(--cond);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
@keyframes grow{from{transform:scaleX(0)}}
.rec-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.rec-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* rest timer */
.rest{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--pri);color:var(--on-pri);border-radius:var(--radius-sm,6px);padding:6px 8px 6px 6px;display:flex;align-items:center;gap:8px;z-index:21;box-shadow:0 10px 28px rgba(var(--sh-c),.3);transform:translate(-50%,140%);opacity:0;pointer-events:none;transition:transform .3s var(--ease),opacity .2s;max-width:calc(100vw - 24px)}
.rest.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.rest .rring{width:44px;height:44px;flex:0 0 auto}
.rest .rring svg{width:44px;height:44px;transform:rotate(-90deg)}
.rest .rring circle{fill:none;stroke-width:4}
.rest .rring .bgc{stroke:currentColor;opacity:.15}
.rest .rring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.rest.end .rring .fg{stroke:var(--yellow)}
.rest b{font-family:var(--cond);font-variant-numeric:tabular-nums;font-size:26px;min-width:56px;line-height:1}
.rest.end{animation:nudge .5s 2}
@keyframes nudge{30%{transform:translate(-50%,-6px)}60%{transform:translate(-50%,0)}}
.rest button.r{height:34px;padding:0 10px;border-radius:var(--radius-sm,6px);background:rgba(127,127,127,.18);font-family:var(--cond);font-weight:600;font-size:16px;white-space:nowrap}

/* bottom sheet */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;height:88vh;height:88dvh;background:var(--g-surface);border-radius:var(--radius,8px) var(--radius,8px) 0 0;box-shadow:0 -10px 40px rgba(var(--sh-c),.18);z-index:41;transform:translateY(105%);visibility:hidden;transition:transform .3s var(--ease),visibility .3s;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none;visibility:visible}
.sheet.full{height:100vh;height:100dvh;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:8px auto 0}
.sh-top,.sh-head,.sh-body{max-width:560px;width:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px 4px}
.sh-head{padding-block:6px 0}
.sh-body{padding-block:6px 28px;overflow:auto;flex:1}
.search,.fld{width:100%;height:50px;border:0;border-radius:var(--radius,8px);background:var(--g-surface);box-shadow:var(--shadow);padding:0 14px;font-size:16px}
.sh-head .search,.sh-body .fld,.sh-body .search{background:var(--sunk);box-shadow:none}
.search:focus,.fld:focus{outline:none;box-shadow:inset 0 0 0 2px var(--blue)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600;font-size:16px;line-height:1.25}
.item .mu{font-size:12px;color:var(--muted);margin-top:2px}
.item .rt{font-size:12px;color:var(--muted);white-space:nowrap}
.item.th{justify-content:flex-start;gap:12px}
.item.th .tx{flex:1;min-width:0}
.item.new .nm{color:var(--blue)}
.add-dot{flex:0 0 auto;width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:20px}

/* exercise detail */
.det h2{font-family:var(--cond);font-weight:700;font-size:34px;line-height:1;margin:4px 0 2px}
.det .alt{color:var(--muted);font-size:15px}
.det .map-box{background:var(--sunk);border-radius:var(--radius,8px);padding:12px;margin:14px 0 10px;display:flex;flex-direction:column;gap:12px}
.det .map-box svg{width:100%;max-width:280px;height:auto;margin:0 auto;display:block}
.legend{font-size:13px;line-height:1.5;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.legend .k{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.det h3{font-family:var(--cond);font-weight:700;font-size:20px;margin:18px 0 6px}
.det p{margin:0;font-size:15px;line-height:1.55;max-width:68ch}
.avoid{list-style:none;margin:0;padding:0}
.avoid li{position:relative;padding:7px 0 7px 26px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45}
.avoid li:last-child{border-bottom:0}
.avoid li::before{content:"";position:absolute;left:2px;top:12px;width:13px;height:13px;border-radius:50%;border:2px solid var(--red);background:linear-gradient(45deg,transparent 44%,var(--red) 44%,var(--red) 58%,transparent 58%)}
.mystats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mystats div{background:var(--sunk);border-radius:var(--radius,8px);padding:10px;min-width:0}
.mystats b{display:block;font-family:var(--cond);font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.mystats span{font-size:12px;color:var(--muted)}
.pg-row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.pg-row .d{font-weight:600;white-space:nowrap}
.pg-row .v{color:var(--muted);font-size:13px;line-height:1.35;min-width:0}
.delta{font-family:var(--cond);font-weight:700;font-size:15px;border-radius:var(--radius-sm,6px);padding:1px 9px;white-space:nowrap}
.delta.up{background:var(--green-soft);color:var(--green)}
.delta.dn{background:var(--red-soft);color:var(--red)}
.delta.eq{background:var(--sunk);color:var(--muted)}

/* plates */
.barbell{background:var(--sunk);border-radius:var(--radius,8px);padding:18px 8px;margin:12px 0;overflow:hidden}
.barbell svg{width:100%;height:auto;display:block}
.platelist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.platelist span{font-family:var(--cond);font-weight:700;font-size:17px;padding:2px 10px;border-radius:4px;color:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

/* summary */
.sum-hero{background:var(--hero1);box-shadow:var(--shadow);color:var(--hero-fg);border-radius:var(--radius,8px);padding:20px 18px;margin:6px 0 12px}
.sum-hero h2{font-family:var(--cond);font-weight:700;font-size:40px;line-height:.95;margin:0 0 4px}
.sum-hero p{margin:0;color:var(--hero-mut);font-size:15px}
.sum-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum-kpis div{background:var(--sunk);border-radius:var(--radius,8px);padding:10px;min-width:0}
.sum-kpis b{display:block;font-family:var(--cond);font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sum-kpis span{font-size:12px;color:var(--muted)}
.prlist .r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px;animation:rise .4s var(--ease) both}
.prlist .r b{font-family:var(--cond);font-size:18px}
.fact{border-radius:var(--radius,8px);padding:8px 12px;margin:12px 0;font-size:15px;background:var(--yellow-soft)}
.fact b{font-family:var(--cond);font-size:19px}

/* calendar */
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-h .m{font-family:var(--cond);font-weight:700;font-size:24px;text-transform:capitalize}
.cal-h button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--g-surface);box-shadow:var(--shadow);font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:12px;color:var(--muted);text-align:center;padding:4px 0}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:var(--radius-sm,6px);display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-size:19px;font-weight:600;position:relative;background:var(--g-surface);border:1px solid transparent;transition:transform .12s}
.cal .d:active{transform:scale(.92)}
.cal .d.out{background:transparent;color:var(--faint)}
.cal .d.today{border-color:var(--g-ink)}
.cal .d.has{background:var(--pri);color:var(--on-pri);box-shadow:0 4px 10px rgba(var(--sh-c),.2)}
.cal .d.has::after{content:"";position:absolute;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.cal .d.sel{outline:2.5px solid var(--blue);outline-offset:1px}
.cal .d.future{color:var(--faint)}
.day-ex{padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.day-ex .t{font-weight:600;display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left}
.day-ex .s{color:var(--muted);font-size:14px;margin-top:2px}
.day-ex .nt{font-size:13px;color:var(--ink2);font-style:italic;margin-top:3px}
.rowbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* progress */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:38px;padding:0 16px;border-radius:var(--radius-sm,6px);background:var(--g-surface);box-shadow:var(--shadow);font-size:14px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s,transform .12s}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--pri);color:var(--on-pri)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--g-surface);border-radius:var(--radius,8px);padding:10px 10px 8px;box-shadow:var(--shadow);min-width:0}
.kpi b{display:block;font-family:var(--cond);font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart .ln{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:line 1s var(--ease) forwards}
@keyframes line{to{stroke-dashoffset:0}}
.chart .dot{animation:fadein .3s ease both}
@keyframes fadein{from{opacity:0}}
.rows .r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.rows .r span{color:var(--muted);text-align:right}
.rows .r b{font-family:var(--cond);font-size:17px;color:var(--g-ink)}

/* settings */
.set-grp{margin-bottom:22px}
.set-grp h3{font-family:var(--cond);font-weight:700;font-size:20px;margin:0 0 8px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .lb{min-width:0}
.set-row .lb div{font-size:13px;color:var(--muted)}
.set-row .seg{margin:0;flex:0 0 auto;min-width:150px}
.tgl{flex:0 0 auto;width:50px;height:30px;border-radius:var(--radius-sm,6px);background:var(--line);position:relative;transition:background .2s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.tgl[aria-checked="true"]{background:var(--green)}
.tgl[aria-checked="true"]::after{transform:translateX(20px)}
.dbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dbtns .wide{grid-column:1/-1}
.io{width:100%;min-height:160px;border:0;border-radius:var(--radius,8px);background:var(--sunk);padding:10px 12px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;margin:8px 0}
.io:focus{outline:none;box-shadow:inset 0 0 0 2px var(--blue)}
.about{font-size:13px;color:var(--muted);line-height:1.55}
.about p{margin:0 0 8px;max-width:60ch}
.confirmbox{background:var(--red-soft);border-radius:var(--radius,8px);padding:12px;margin-top:8px;font-size:14px}
.confirmbox .rowbtns{margin-top:10px}

.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) translateY(-120px);background:var(--pri);color:var(--on-pri);padding:11px 18px;border-radius:var(--radius-sm,6px);font-size:15px;z-index:60;transition:transform .3s var(--ease);max-width:92vw;box-shadow:0 10px 24px rgba(var(--sh-c),.25);text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.gold{background:var(--yellow);color:#1B2130;font-weight:600}
#view.enter{animation:viewin .28s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:360px){.hero-num{font-size:46px}.qa-i{width:52px;height:52px}}

</style>

 chest:["Chest","Klatka piersiowa"],shoulders:["Shoulders (front, side)","Barki (przód, bok)"],rear:["Rear delts","Tył barków"],

const plural=(n,k)=>{const f=P[k][L()]; let w; if(lang==="pl") w=n===1?f[0]:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?f[1]:f[2]); else w=n===1?f[0]:f[1]; return n+" "+w;};

/* ---------- library lookup ---------- */
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ł/g,"l");
const ALIAS=[];LIB.forEach(e=>{[...e.n,...e.al].forEach(a=>ALIAS.push([norm(a),e]))});ALIAS.sort((a,b)=>b[0].length-a[0].length);
const LIBBY=Object.fromEntries(LIB.map(e=>[e.id,e]));
const libCache=new Map();
function findLib(name){ if(libCache.has(name)) return libCache.get(name); const n=norm(name); const hit=ALIAS.find(([a])=>n.includes(a)); const r=hit?hit[1]:null; libCache.set(name,r); return r; }
const keyOf=e=>{ if(e.lib&&LIBBY[e.lib]) return e.lib; const l=findLib(e.name); return l?l.id:"c:"+e.name; };
const libOf=e=>LIBBY[keyOf(e)]||null;
const exLabel=e=>{const l=libOf(e);return l?nm(l):e.name};
const keyLabel=k=>LIBBY[k]?nm(LIBBY[k]):k.slice(2);

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ds=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ds(new Date());
const pd=s=>new Date(s+"T12:00:00");
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmtDate=s=>{try{return pd(s).toLocaleDateString(LOC(),{weekday:"long",day:"numeric",month:"long"})}catch(e){return s}};
const fmtShort=s=>{try{return pd(s).toLocaleDateString(LOC(),{day:"numeric",month:"short"})}catch(e){return s}};
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};
const fmtN=n=>(Math.round(n*10)/10).toLocaleString(LOC());
const U=()=>settings().unit==="lb"?"lb":"kg";
const fmtW=n=>fmtN(n)+" "+U();
const e1rm=(kg,r)=>r>0&&kg>0?(r===1?kg:kg*(1+r/30)):0;
const clone=o=>JSON.parse(JSON.stringify(o));
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fmtSec=v=>{v=Math.round(num(v));const neg=v<0;v=Math.abs(v);return (neg?"−":"")+(v>=60?Math.floor(v/60)+":"+String(v%60).padStart(2,"0")+" min":v+" s")};
const fmtDur=ms=>{const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+" h "+(m%60)+" min":m+" min"};
const clock=ms=>{const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};

const mondayOf=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};

const KEY="gym-notebook.v1";

const ID_RE=/^[A-Za-z0-9_-]{1,64}$/;
const str=(v,max)=>v==null?"":String(v).slice(0,max);
const intIn=(v,a,b,d)=>{const n=Math.round(Number(v));return isFinite(n)?Math.min(b,Math.max(a,n)):d};
const tsOr=v=>{const n=Number(v);return isFinite(n)&&n>0?n:null};
const numStr=v=>{if(v==null||v==="") return ""; const n=parseFloat(String(v).replace(",",".")); return isFinite(n)&&n>=0&&n<100000?String(Math.round(n*1000)/1000):"";};
function sanEx(e,plan){
  if(!e||typeof e!=="object") return null;
  const name=str(e.name,80).trim(); if(!name) return null;
  const o={name}; if(typeof e.lib==="string"&&LIBBY[e.lib]) o.lib=e.lib;
  if(e.type==="t"||e.type==="w") o.type=e.type;
  if(plan){ o.n=intIn(e.n,1,20,3); return o; }
  if(e.note) o.note=str(e.note,500);
  o.sets=Array.isArray(e.sets)?e.sets.slice(0,40).map(s=>({kg:numStr(s&&s.kg),reps:numStr(s&&s.reps),done:!!(s&&s.done)})):[];
  return o;
}
function sanitize(id,d){
  if(typeof id!=="string"||!ID_RE.test(id)||!d||typeof d!=="object"||Array.isArray(d)) return null;
  if(id==="settings") return {kind:"settings",goal:intIn(d.goal,1,7,3),lang:d.lang==="pl"||d.lang==="en"?d.lang:null,unit:d.unit==="lb"?"lb":"kg",sound:d.sound!==false,wake:d.wake!==false,seeded:!!d.seeded};
  const raw=Array.isArray(d.exercises)?d.exercises.slice(0,60):[];
  if(d.kind==="plan") return {kind:"plan",name:str(d.name,40).trim()||"Plan",createdAt:tsOr(d.createdAt)||Date.now(),usedAt:tsOr(d.usedAt),sample:!!d.sample,exercises:raw.map(e=>sanEx(e,true)).filter(Boolean)};
  if(d.kind) return null;
  if(typeof d.date!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||isNaN(pd(d.date))) return null;
  const o={date:d.date,createdAt:tsOr(d.createdAt)||Date.now(),startedAt:tsOr(d.startedAt),finishedAt:tsOr(d.finishedAt),done:!!d.done,exercises:raw.map(e=>sanEx(e,false)).filter(Boolean)};
  if(d.reopened) o.reopened=true; if(d.sample) o.sample=true;
  if(typeof d.planId==="string"&&ID_RE.test(d.planId)) o.planId=d.planId;
  if(d.planName) o.planName=str(d.planName,40);
  return o;
}
function readDocs(obj){ /* accepts an export ({docs:{...}}) or a plain id→doc map */
  const src=obj&&typeof obj==="object"&&!Array.isArray(obj)?(obj.docs&&typeof obj.docs==="object"&&!Array.isArray(obj.docs)?obj.docs:obj):null;
  const out=new Map(); if(!src) return out;
  Object.keys(src).forEach(k=>{ const s=sanitize(k,src[k]); if(s) out.set(k,s); });
  return out;
}
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw) readDocs(JSON.parse(raw)).forEach((v,k)=>docs.set(k,v));
       localStorage.setItem(KEY+".probe","1"); localStorage.removeItem(KEY+".probe"); }
  catch(e){ canStore=false; }
}
function persist(){
  clearTimeout(saveT); saveT=null;
  try{ const o={}; docs.forEach((v,k)=>o[k]=v); localStorage.setItem(KEY,JSON.stringify({app:"gym-notebook",version:1,docs:o})); canStore=true; }
  catch(e){ if(canStore){ canStore=false; renderNotice(); } }
}
function queueSave(){ clearTimeout(saveT); saveT=setTimeout(persist,300); }
addEventListener("pagehide",()=>{ if(saveT) persist(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&saveT) persist(); syncWake(); });
function removeDoc(id){ docs.delete(id); queueSave(); render(); }

const sorted=()=>[...docs.entries()].filter(([,w])=>!w.kind).map(([id,w])=>({id,...w})).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
const plans=()=>[...docs.entries()].filter(([,w])=>w.kind==="plan").map(([id,w])=>({id,...w})).sort((a,b)=>(b.usedAt||b.createdAt||0)-(a.usedAt||a.createdAt||0));
function settings(){ return docs.get("settings")||{kind:"settings",goal:3,unit:"kg",sound:true,wake:true}; }
function saveSettings(o){ docs.set("settings",Object.assign({},settings(),o,{kind:"settings"})); queueSave(); }
const active=()=>sorted().find(w=>!w.done);
const valid=ex=>(ex.sets||[]).filter(s=>num(s.reps)>0);

function chart(pts){
  const W=340,H=180,pl=38,pr=14,pt=22,pb=24;
  if(pts.length===1) pts=[pts[0],pts[0]];
  const vs=pts.map(p=>p.v);let mn=Math.min(...vs),mx=Math.max(...vs);
  if(mx-mn<1){mn-=5;mx+=5;} const pad=(mx-mn)*.15;mn=Math.max(0,mn-pad);mx+=pad;
  const x=i=>pl+(W-pl-pr)*(i/(pts.length-1)), y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let len=0; for(let i=1;i<pts.length;i++) len+=Math.hypot(x(i)-x(i-1),y(pts[i].v)-y(pts[i-1].v));
  const line=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const area=line+` L${x(pts.length-1).toFixed(1)} ${H-pb} L${pl} ${H-pb} Z`;
  const L_=pts.length-1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(fmtShort(pts[0].d))} – ${esc(fmtShort(pts[L_].d))}: ${fmtN(pts[0].v)} → ${fmtN(pts[L_].v)}">
    ${[mn,(mn+mx)/2,mx].map(tk=>`<line x1="${pl}" x2="${W-pr}" y1="${y(tk).toFixed(1)}" y2="${y(tk).toFixed(1)}" stroke="var(--line)"/><text x="${pl-6}" y="${(y(tk)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(tk)}</text>`).join("")}
    <path d="${area}" fill="var(--blue)" fill-opacity=".08"/>
    <path class="ln" style="--len:${Math.ceil(len)+2}" d="${line}" fill="none" stroke="var(--g-ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle class="dot" style="animation-delay:${Math.round(i/Math.max(1,L_)*700)}ms" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i===L_?5:3.5}" fill="${i===L_?"var(--red)":"var(--g-surface)"}" stroke="${i===L_?"var(--red)":"var(--g-ink)"}" stroke-width="2"/>`).join("")}
    <text x="${pl}" y="${H-5}" font-size="11" fill="var(--muted)">${esc(fmtShort(pts[0].d))}</text>
    <text x="${W-pr}" y="${H-5}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(fmtShort(pts[L_].d))}</text>
    <text x="${Math.min(x(L_),W-pr)}" y="${Math.max(14,y(pts[L_].v)-11)}" font-size="15" font-weight="700" fill="var(--g-ink)" text-anchor="end" style="font-family:var(--cond)">${fmtN(pts[L_].v)}</text>
  </svg>`;
}

  for(let back=55;back>=1;back--){
    const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-back); const dow=(d.getDay()+6)%7;
    if(![0,2,4].includes(dow)&&!(dow===5&&r()<.25)) continue;
    if(r()<.1) continue;
    const p=PL[rot%3]; rot++;
    const start=new Date(d); start.setHours(dow===5?10:18,Math.floor(r()*40),0,0);
    const exs=p.ex.map(([id,n,base,inc,reps])=>{
      const i=cnt[id]=(cnt[id]||0)+1; const l=LIBBY[id];
      const sets=[];
      for(let j=0;j<n;j++){
        if(l.unit==="s"){ sets.push({kg:"",reps:String(base+inc*Math.floor(i/2)+(j===n-1?-5:0)),done:true}); continue; }
        if(!base){ const rr=reps+Math.floor(i/3)-(j===n-1&&r()<.5?1:0)-(j>0&&r()<.3?1:0); sets.push({kg:"",reps:String(Math.max(1,rr)),done:true}); continue; }
        const kg=rw(base+inc*Math.floor((i-1)/2)); const miss=j===n-1&&r()<.35?1+Math.floor(r()*2):0;
        sets.push({kg:String(kg),reps:String(reps-miss),done:true});
      }
      const o={name:nm(l),lib:id,sets}; if(NOTES[id]&&i===1) o.note=NOTES[id][P_]; return o;
    });
    const wid="wSample"+ds(d).replace(/-/g,"");
    out.set(wid,{date:ds(d),createdAt:start.getTime(),startedAt:start.getTime(),finishedAt:start.getTime()+(52+Math.floor(r()*20))*60000,done:true,planId:p.id,planName:p.n[P_],sample:true,exercises:exs});
  }
  return out;
}
function loadSample(){ if(active()){ toast(t("sampleBusy")); return; } makeSample().forEach((v,k)=>docs.set(k,v)); saveSettings({seeded:true}); persist(); progEx=null; }
function removeSample(){ [...docs.entries()].forEach(([k,d])=>{ if(d.sample) docs.delete(k); }); saveSettings({seeded:true}); persist(); progEx=null; }

/* ---------- rest timer, sound, screen ---------- */
let restEnd=0,restTotal=90000,restIv=null,restBuzzed=false,actx=null,wakeLock=null,wakeBusy=false;
function primeAudio(){ if(settings().sound===false) return; try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; actx=actx||new AC(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(){ if(settings().sound===false||!actx) return; try{ [0,.22].forEach(off=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=880; const t0=actx.currentTime+off; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.25,t0+.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+.18); o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+.2); }); }catch(e){} }
function startRest(sec){restTotal=sec*1000;restEnd=Date.now()+restTotal;restBuzzed=false;$("#rest").classList.add("on");$("#rest").classList.remove("end");clearInterval(restIv);restIv=setInterval(tickRest,250);tickRest();}
function tickRest(){const ms=restEnd-Date.now();const s=Math.max(0,Math.ceil(ms/1000));$("#restT").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  const C=119.4; $("#restRing").setAttribute("stroke-dashoffset",(C*(1-Math.max(0,ms)/restTotal)).toFixed(1));
  const end=s===0; $("#rest").classList.toggle("end",end); if(end&&!restBuzzed){restBuzzed=true;buzz([120,80,120]);beep();}
  if(ms<-20000)stopRest();}
function stopRest(){clearInterval(restIv);$("#rest").classList.remove("on","end");}
async function syncWake(){
  const want=settings().wake!==false&&!!active()&&document.visibilityState==="visible";
  if(wakeBusy) return; wakeBusy=true;
  try{
    if(want&&!wakeLock&&navigator.wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>{wakeLock=null}); }
    else if(!want&&wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ wakeLock=null; }
  wakeBusy=false;
}

/* ---------- actions ---------- */
function newWorkout(exercises,date,extra){
  const id=uid("w"); const d=date||today();
  docs.set(id,Object.assign({date:d,createdAt:Date.now(),startedAt:d===today()?Date.now():null,finishedAt:null,done:false,exercises:exercises||[]},extra||{}));
  queueSave(); return id;
}
function addExercise(k){
  let name,lib=null;
  if(LIBBY[k]){ lib=k; name=nm(LIBBY[k]); } else { name=String(k||"").replace(/^c:/,"").trim().slice(0,80); const l=findLib(name); if(l&&norm(nm(l))===norm(name)){lib=l.id;} }
  if(!name) return;
  let w=active(); if(!w){newWorkout();w=active();}
  const obj=docs.get(w.id);
  const e={name}; if(lib) e.lib=lib;
  const prev=lastPerf(keyOf(e),w.id);
  const n=prev?Math.max(1,prev.sets.length):3;
  e.sets=Array.from({length:n},()=>({kg:"",reps:"",done:false}));
  obj.exercises.push(e);
  fxNew="ex"+(obj.exercises.length-1);
  queueSave(); closeSheet(); tab="workout"; render();
  setTimeout(()=>{const els=document.querySelectorAll(".ex");const el=els[els.length-1];if(el)el.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"center"});},60);
}
const exCopy=e=>({name:e.name,...(e.lib?{lib:e.lib}:{}),...(e.type?{type:e.type}:{})});
function copyFrom(src){ return (src.exercises||[]).filter(e=>valid(e).length).map(e=>({...exCopy(e),sets:valid(e).map(s=>({kg:s.kg??"",reps:s.reps,done:false}))})); }
function blankFrom(exs){ return (exs||[]).map(e=>({...exCopy(e),sets:Array.from({length:Math.max(1,e.n||(e.sets?valid(e).length||e.sets.length:3))},()=>({kg:"",reps:"",done:false}))})); }

document.addEventListener("click",ev=>{
  const tb=ev.target.closest("nav.tabs button");
  if(tb){ if(tab!==tb.dataset.tab) enterAnim=true; tab=tb.dataset.tab;confirmDel=null;render();window.scrollTo(0,0);return;}
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act;
  const w=active(); const wo=w?docs.get(w.id):null;
  const setEl=b.closest(".set");
  const ei=setEl?+setEl.dataset.ex:(b.dataset.ex!=null?+b.dataset.ex:null);
  const si=setEl?+setEl.dataset.set:null;
  if(!["ex-del","discard","h-del","plan-del"].includes(act)) confirmDel=null;
  switch(act){
    case "start": if(!w) newWorkout(); enterAnim=true; render(); openSheet("pick"); break;
    case "repeat":{ const last=sorted().find(x=>x.done); if(!last||w) return; newWorkout(blankFrom(last.exercises.filter(e=>valid(e).length)),null,last.planName?{planId:last.planId,planName:last.planName}:null); enterAnim=true; render(); window.scrollTo(0,0); break;}
    case "plan-start":{ const p=docs.get(b.dataset.id); if(!p) return; if(w){toast(t("finishFirst"));return;}
      newWorkout(blankFrom(p.exercises),null,{planId:b.dataset.id,planName:p.name}); p.usedAt=Date.now(); queueSave(); enterAnim=true; render(); window.scrollTo(0,0); break;}
    case "copy":{ const src=docs.get(b.dataset.id); if(!src) return; if(w){toast(t("finishFirst"));return;}
      newWorkout(copyFrom(src),null,src.planName?{planId:src.planId,planName:src.planName}:null); tab="workout"; enterAnim=true; closeSheet(); render(); window.scrollTo(0,0); toast(t("copied",fmtShort(src.date))); break;}
    case "plan-del":{ const id=b.dataset.id; if(confirmDel==="p"+id){confirmDel=null;removeDoc(id);} else {confirmDel="p"+id;render();} break;}
    case "plan-from":{ const src=docs.get(b.dataset.id); if(!src) return; openSheet("plan",{id:b.dataset.id,...src}); break;}
    case "plan-save":{ const src=docs.get(b.dataset.id); if(!src) return; const name=($("#planName").value||"").trim().slice(0,40)||t("myPlan");
      const pid=uid("p");
      docs.set(pid,{kind:"plan",name,createdAt:Date.now(),usedAt:null,exercises:(src.exercises||[]).filter(e=>valid(e).length||!src.done).map(e=>({...exCopy(e),n:valid(e).length||(e.sets||[]).length||3}))});
      queueSave(); closeSheet(); toast(t("planSaved",name)); render(); break;}
    case "goal-": saveSettings({goal:Math.max(1,(settings().goal||3)-1)}); render(); break;
    case "goal+": saveSettings({goal:Math.min(7,(settings().goal||3)+1)}); render(); break;
    case "ex-add": openSheet("pick"); break;
    case "set-add":{ if(!wo) return; const ex=wo.exercises[ei]; const l=ex.sets[ex.sets.length-1]; ex.sets.push({kg:l?l.kg:"",reps:l?l.reps:"",done:false}); fxNew="s"+ei+"-"+(ex.sets.length-1); queueSave(); render(); break;}
    case "set-del": if(!wo) return; wo.exercises[ei].sets.splice(si,1); queueSave(); render(); break;
    case "done":{
      if(!wo) return; primeAudio();
      const ex=wo.exercises[ei]; const s=ex.sets[si];
      const ik=setEl.querySelector('[data-f="kg"]'), ir=setEl.querySelector('[data-f="reps"]');
      if(!s.done){ const pk=ik?ik.placeholder:"0", pr=ir.placeholder; if(ik&&s.kg===""&&pk!=="0"&&pk!=="—") s.kg=String(num(pk.replace(/\s/g,""))); if(s.reps===""&&pr!=="0") s.reps=pr; }
      if(!s.done&&!num(s.reps)){ toast(typeOf(ex)==="s"?t("needSec"):t("needReps")); if(ir) ir.focus(); return; }
      s.done=!s.done; queueSave();
      if(s.done){
        fxPop="s"+ei+"-"+si; buzz(15);
        const k=keyOf(ex), u=typeOf(ex); const b2=bestBefore(k,w.id), br=bestRepsBefore(k,w.id);
        const others=ex.sets.filter((x,j)=>j!==si&&x.done);
        const isPR=(u==="s"||!num(s.kg))?(br>0&&num(s.reps)>br&&others.every(x=>num(x.reps)<num(s.reps))):(b2>0&&e1rm(num(s.kg),num(s.reps))>b2+0.01&&others.every(x=>e1rm(num(x.kg),num(x.reps))<e1rm(num(s.kg),num(s.reps))));
        if(isPR){ toast(t("newPR",exLabel(ex),setsTxt([s],u)),"gold"); confetti(); }
        const all=wo.exercises.every(e=>(e.sets||[]).every(x=>x.done));
        if(!all) startRest(restFor(ex)); else { stopRest(); if(!isPR) toast(t("allDone")); }
      }
      render(); break;}
    case "qo":{ if(!wo) return; const ex=wo.exercises[ei]; const prev=lastPerf(keyOf(ex),w.id); if(!prev) return; const o=quickOpts(ex,prev).find(x=>x.id===b.dataset.o); if(!o) return;
      const dn=ex.sets.filter(x=>x.done); ex.sets=dn.concat(o.sets.slice(dn.length).map(x=>({kg:x.kg,reps:x.reps,done:false})));
      if(ex.sets.length===dn.length) ex.sets.push(Object.assign({},o.sets[o.sets.length-1],{done:false}));
      ex.qo=o.id; queueSave(); buzz(10); render(); break;}
    case "note": if(!wo) return; wo.exercises[ei].noteOpen=true; render(); setTimeout(()=>{const tx=$("#note-"+ei); if(tx) tx.focus();},30); break;
    case "plates":{ if(!wo) return; const ex=wo.exercises[ei]; const s=ex.sets.find(x=>!x.done&&x.kg!=="")||ex.sets.find(x=>x.kg!=="");
      const ph=lastPerf(keyOf(ex),w.id); plateKg=(s?num(s.kg):(ph?Math.max(...ph.sets.map(x=>num(x.kg))):0))||(U()==="lb"?135:60); openSheet("plates",{ex:ei}); break;}
    case "pbar": plateBar=+b.dataset.b; renderPlates(); break;
    case "plates-use":{ const ex=wo&&wo.exercises[sheetArg.ex]; if(!ex) return; const {rest}=plateMath(plateKg,plateBar); const v=String(Math.round((plateKg-Math.max(0,rest)*2)*100)/100);
      ex.sets.forEach(s=>{ if(!s.done&&s.kg==="") s.kg=v; }); queueSave(); closeSheet(); render(); break;}
    case "ex-type":{ if(!wo) return; const ex=wo.exercises[ei]; ex.type=typeOf(ex)==="s"?"w":"t"; if(ex.type==="t") ex.sets.forEach(x=>x.kg=""); queueSave(); render(); break;}
    case "ex-del": if(!wo) return; if(confirmDel==="ex"+ei){wo.exercises.splice(ei,1);confirmDel=null;queueSave();} else confirmDel="ex"+ei; render(); break;
    case "discard": if(!w) return; if(confirmDel==="discard"){confirmDel=null;stopRest();removeDoc(w.id);} else {confirmDel="discard";render();} break;
    case "finish":{
      if(!wo) return;
      wo.exercises=wo.exercises.map(e=>{ const {noteOpen,qo,...rest}=e; return {...rest,sets:e.sets.filter(s=>num(s.reps)>0)}; }).filter(e=>e.sets.length);
      if(!wo.exercises.length){toast(t("needOne"));render();return;}
      wo.done=true; if(!wo.reopened) wo.finishedAt=Date.now(); persist(); stopRest(); calSel=wo.date; render(); window.scrollTo(0,0); openSheet("summary",w.id); break;}
    case "day": calSel=b.dataset.d; render(); break;
    case "cal-prev": calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1); enterAnim=true; render(); break;
    case "cal-next": calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1); enterAnim=true; render(); break;
    case "add-day": if(w){toast(t("finishFirst"));return;} newWorkout([],calSel); tab="workout"; enterAnim=true; render(); openSheet("pick"); break;
    case "h-del":{const id=b.dataset.id; if(confirmDel==="h"+id){confirmDel=null;removeDoc(id);} else {confirmDel="h"+id;render();} break;}
    case "h-edit":{ const id=b.dataset.id; if(w){toast(t("finishFirst"));return;} const d=docs.get(id); if(!d) return; d.done=false; d.reopened=true; queueSave(); tab="workout"; enterAnim=true; render(); window.scrollTo(0,0); break;}
    case "pick": progEx=b.dataset.k; render(); if(b.closest(".rows")) window.scrollTo({top:0,behavior:reduced()?"auto":"smooth"}); break;
    case "metric": progMetric=b.dataset.m; render(); break;
    case "days": progDays=+b.dataset.d; render(); break;
    case "lf": libFilter=b.dataset.m||null; render(); break;
    case "info": openSheet("info",{k:b.dataset.k,name:b.dataset.name}); break;
    case "plates-free": plateKg=U()==="lb"?135:60; openSheet("plates",{ex:null}); break;
    case "go-lib": tab="library"; enterAnim=true; render(); window.scrollTo(0,0); break;
    case "imetric": infoMetric=b.dataset.m; { const st=$("#shBody").scrollTop; renderInfo(sheetArg.k,sheetArg.name); $("#shBody").scrollTop=st; } break;
    case "mapmode": mapMode=b.dataset.m; render(); break;
    case "sheet-close": closeSheet(); break;
    case "rest-add": restEnd+=30000; restTotal+=30000; restBuzzed=false; tickRest(); break;
    case "rest-sub": restEnd-=15000; tickRest(); break;
    case "rest-stop": stopRest(); break;
    case "pick-ex": addExercise(b.dataset.k); break;
    /* settings */
    case "open-settings": openSheet("settings"); break;
    case "lang": setLang(b.dataset.v); break;
    case "unit": saveSettings({unit:b.dataset.v}); plateBar=null; render(); renderSettings(); break;
    case "tgl":{ const k=b.dataset.k; saveSettings({[k]:settings()[k]===false}); if(k==="sound"&&settings().sound) primeAudio(); renderSettings(); syncWake(); break;}
    case "set-open-export": if(sheetMode!=="settings") openSheet("settings",{view:"export"}); else { setView="export"; renderSettings(); } break;
    case "set-open-import": setView="import"; renderSettings(); break;
    case "set-back": setView="main"; renderSettings(); break;
    case "exp-copy":{ const ta=$("#ioOut"); const txt=ta.value; const fail=()=>{ ta.focus(); ta.select(); toast(t("copyFail")); };
      try{ navigator.clipboard.writeText(txt).then(()=>toast(t("copiedT")),fail); }catch(e){ fail(); } break;}
    case "exp-dl":{ try{ const blob=new Blob([exportJson()],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="gym-tracker-"+today()+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); }catch(e){ toast(t("dlHint")); } break;}
    case "imp-check": checkImport(); break;
    case "imp-merge": applyImport(false); break;
    case "imp-replace": applyImport(true); break;
    case "sample-load": loadSample(); if(!active()){ closeSheet(); tab="workout"; enterAnim=true; render(); window.scrollTo(0,0); toast(t("sampleLoaded")); } break;
    case "sample-del": removeSample(); render(); if(sheetMode==="settings") renderSettings(); toast(t("sampleGone")); break;
    case "wipe": wipeAsk=true; renderSettings(); break;
    case "wipe-no": wipeAsk=false; renderSettings(); break;
    case "wipe-yes":{ const keep={lang,seeded:true}; docs.clear(); saveSettings(keep); stopRest(); persist(); wipeAsk=false; closeSheet(); tab="workout"; render(); toast(t("wiped")); break;}
  }
});
document.addEventListener("toggle",ev=>{const d=ev.target; if(d.dataset&&d.dataset.fold){try{sessionStorage.setItem(d.dataset.fold,d.open?"1":"0")}catch(e){}}},true);
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="exSearch"){renderPick();return;}
  if(el.id==="libSearch"){libQuery=el.value; const used=usedKeys(); renderLibraryList(used); return;}
  if(el.id==="plKg"){ plateKg=num(el.value); const pos=el.selectionStart; renderPlates(); const n=$("#plKg"); n.focus(); try{n.setSelectionRange(pos,pos)}catch(e){} return; }
  const f=el.dataset.f; if(!f) return;
  const w=active(); if(!w) return; const wo=docs.get(w.id);
  if(f==="date"){ if(el.value&&/^\d{4}-\d{2}-\d{2}$/.test(el.value)){wo.date=el.value;queueSave();$("#title").textContent=cap(fmtDate(wo.date));} return; }
  if(f==="kg"){ const sm=el.parentElement.querySelector(".ph"); if(sm) sm.textContent=perHand(el.value); }
  if(f==="note"){ wo.exercises[+el.dataset.ex].note=el.value.slice(0,500); queueSave(); return; }
  const setEl=el.closest(".set"); if(!setEl) return;
  wo.exercises[+setEl.dataset.ex].sets[+setEl.dataset.set][f]=el.value.replace(",",".").slice(0,8); queueSave();
});
function renderLibraryList(used){
  const q=norm(libQuery);
  let items=LIB.map(e=>({k:e.id,name:nm(e),alt:e.n[1-L()],find:e.n[1-L()]+" "+e.al.join(" "),p:e.p,s:e.s}));
  used.forEach((v,k)=>{ if(k.startsWith("c:")) items.push({k,name:v.name,alt:t("custom"),find:"",p:[],s:[]}); });
  items=items.filter(e=>(!q||norm(e.name+" "+e.find).includes(q))&&(!libFilter||e.p.includes(libFilter)||e.s.includes(libFilter)));
  items.sort((a,b)=>(used.has(b.k)-used.has(a.k))||a.name.localeCompare(b.name,LOC()));
  const box=$("#libList"); if(box) box.innerHTML=libItems(items,used);
}
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&sheetMode){ closeSheet(); return; }
  if(ev.key==="Tab"&&sheetMode){ /* keep focus inside the open sheet */
    const f=[...$("#sheet").querySelectorAll("button,input,textarea,select,label[for],[tabindex]:not([tabindex='-1'])")].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(f.length){ const a=f[0], z=f[f.length-1]; if(ev.shiftKey&&document.activeElement===a){ev.preventDefault();z.focus();} else if(!ev.shiftKey&&document.activeElement===z){ev.preventDefault();a.focus();} else if(!$("#sheet").contains(document.activeElement)){ev.preventDefault();a.focus();} }
  }
  if(ev.key==="Enter"&&ev.target.id==="exSearch"){ const v=ev.target.value.trim(); if(v){ const l=findLib(v); addExercise(l&&norm(nm(l)).includes(norm(v))?l.id:"c:"+v);} }
  if(ev.key==="Enter"&&ev.target.id==="planName"){ const bt=document.querySelector('[data-act="plan-save"]'); if(bt) bt.click(); }
  if(ev.key==="Enter"&&ev.target.dataset&&ev.target.dataset.f==="kg"){ ev.preventDefault(); const r=ev.target.closest(".set").querySelector('[data-f="reps"]'); r.focus(); }
});
document.addEventListener("focusout",ev=>{ if(ev.target.closest&&(ev.target.closest(".set")||ev.target.classList.contains("note"))) setTimeout(()=>{const ae=document.activeElement;if(!(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")))render();},120); });
$("#sheetBg").addEventListener("click",closeSheet);

let toastT;
function toast(m,kind){const tt=$("#toast");tt.textContent=m;tt.classList.toggle("gold",kind==="gold");tt.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>tt.classList.remove("on"),2800);}

load(); initLang();
if(!settings().seeded&&![...docs.keys()].some(k=>k!=="settings")){ makeSample().forEach((v,k)=>docs.set(k,v)); saveSettings({seeded:true}); persist(); }
applyStatic(); render();
})();
